<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BookBase | Student Library</title>

  <link rel="stylesheet" href="./student.css?v=student-oop-2">
  <script type="module" src="./student.js?v=oop-presentation-1"></script>
</head>

<body>
  <div
    id="page-loader"
    role="status"
    aria-label="Loading dashboard"
  >
    <span></span>
  </div>

  <!-- Reusable icons -->
  <svg
    class="icon-definitions"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M12 5C8 2 4 3 2 4v15c4-1 7 0 10 2 3-2 6-3 10-2V4c-3-1-6-2-10 1ZM12 5v16"/>
    </symbol>

    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/>
    </symbol>

    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </symbol>

    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="m16 16 5 5"/>
    </symbol>

    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    </symbol>

    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>

    <symbol id="i-help" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .6-1.5 1-1.5 2M12 16h.01"/>
    </symbol>

    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M9 4H4v16h5M9 12h12m-4-4 4 4-4 4"/>
    </symbol>

    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </symbol>

    <symbol id="i-history" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/>
    </symbol>

    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m7 10 5 5 5-5"/>
    </symbol>

    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </symbol>

    <symbol id="i-id" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <circle cx="8" cy="10" r="2"/>
      <path d="M5 16a3 3 0 0 1 6 0M14 9h4M14 13h4"/>
    </symbol>

    <symbol id="i-graduation" viewBox="0 0 24 24">
      <path d="m2 9 10-5 10 5-10 5Zm4 2v6c4 3 8 3 12 0v-6M22 9v7"/>
    </symbol>

    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="m3 6 9 7 9-7"/>
    </symbol>

    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/>
    </symbol>

    <symbol id="i-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="m8 12 3 3 5-6"/>
    </symbol>

    <symbol id="i-key" viewBox="0 0 24 24">
      <circle cx="8" cy="8" r="5"/>
      <path d="m12 12 9 9M17 17l3-3M14 14l3-3"/>
    </symbol>

    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="m16 3 5 5-12 12-6 1 1-6Zm-2 2 5 5"/>
    </symbol>

    <symbol id="i-save" viewBox="0 0 24 24">
      <path d="M4 3h13l4 4v14H3V3ZM7 3v6h10V3M7 21v-8h10v8"/>
    </symbol>
  </svg>

  <p id="loading" class="empty" role="status" hidden></p>

  <div id="app" hidden>
    <div class="shade" id="shade" hidden></div>

    <!-- Sidebar -->
    <aside
      class="sidebar"
      id="sidebar"
      aria-label="Library navigation"
    >
      <div class="brand">
        <span class="brand-logo">
          <svg class="icon" aria-hidden="true">
            <use href="#i-book"/>
          </svg>
        </span>
        BookBase
      </div>

      <p class="nav-label">MAIN</p>

      <nav aria-label="Main navigation">
        <button
          type="button"
          class="nav-button active"
          data-view="discover"
          aria-current="page"
        >
          <svg class="icon" aria-hidden="true">
            <use href="#i-home"/>
          </svg>
          Discover
        </button>

        <button type="button" class="nav-button" data-view="category">
          <svg class="icon" aria-hidden="true">
            <use href="#i-grid"/>
          </svg>
          Category
        </button>

        <button type="button" class="nav-button" data-view="library">
          <svg class="icon" aria-hidden="true">
            <use href="#i-book"/>
          </svg>
          My Borrowed Books
        </button>

        <button type="button" class="nav-button" data-view="history">
          <svg class="icon" aria-hidden="true">
            <use href="#i-history"/>
          </svg>
          Borrowing History
        </button>

        <button type="button" class="nav-button" data-view="favourite">
          <svg class="icon" aria-hidden="true">
            <use href="#i-heart"/>
          </svg>
          Favourite Books
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="divider"></div>

        <button type="button" class="nav-button" data-view="settings">
          <svg class="icon" aria-hidden="true">
            <use href="#i-settings"/>
          </svg>
          Settings
        </button>

        <button type="button" class="nav-button" data-view="support">
          <svg class="icon" aria-hidden="true">
            <use href="#i-help"/>
          </svg>
          Support
        </button>

        <button
          type="button"
          class="nav-button logout-button"
          data-logout
        >
          <svg class="icon" aria-hidden="true">
            <use href="#i-logout"/>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <div class="workspace">
      <!-- Header -->
      <header class="topbar">
        <button
          type="button"
          class="icon-button mobile-menu"
          id="menu-button"
          aria-label="Open navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg class="icon" aria-hidden="true">
            <use href="#i-menu"/>
          </svg>
        </button>

        <label class="search">
          <svg class="icon" aria-hidden="true">
            <use href="#i-search"/>
          </svg>

          <input
            type="search"
            id="search"
            placeholder="Search title, author, category or Book ID..."
            aria-label="Search books by title, author, category or Book ID"
          >
        </label>

        <div class="top-actions">
          <!-- Notifications -->
          <div class="action-wrap">
            <button
              type="button"
              class="icon-button"
              data-dropdown="notifications"
              aria-controls="notifications"
              aria-expanded="false"
              aria-label="Borrowing notifications"
            >
              <svg class="icon" aria-hidden="true">
                <use href="#i-bell"/>
              </svg>
            </button>

            <div class="dropdown" id="notifications" hidden>
              <h3>Borrowing updates</h3>

              <div id="notification-list">
                <p>Loading updates...</p>
              </div>
            </div>
          </div>

          <!-- Profile -->
          <div class="action-wrap">
            <button
              type="button"
              class="profile-button"
              data-dropdown="profile"
              aria-controls="profile"
              aria-expanded="false"
              aria-label="Open profile"
            >
              <span class="avatar" id="avatar" aria-hidden="true">S</span>

              <span class="user-summary">
                <strong id="header-name">Student</strong>
                <small>Student account</small>
              </span>

              <svg class="icon profile-arrow" aria-hidden="true">
                <use href="#i-chevron"/>
              </svg>
            </button>

            <div class="dropdown" id="profile" hidden>
              <h3 id="profile-name">Student</h3>
              <p id="profile-email"></p>

              <p class="profile-role">
                <svg class="icon" aria-hidden="true">
                  <use href="#i-shield"/>
                </svg>
                Student · Email verified
              </p>

              <div class="profile-dropdown-meta">
                <p>
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-id"/>
                  </svg>
                  <span id="dropdown-student-id">Not provided</span>
                </p>

                <p>
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-graduation"/>
                  </svg>
                  <span id="profile-course-text">Not provided</span>
                </p>
              </div>

              <button
                type="button"
                class="profile-action"
                data-profile-details
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-user"/>
                </svg>
                <span>Profile details</span>
              </button>

              <button
                type="button"
                class="profile-action"
                data-view="settings"
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-edit"/>
                </svg>
                <span>Edit profile</span>
              </button>

              <button
                type="button"
                class="profile-action profile-logout"
                data-logout
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-logout"/>
                </svg>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="content">
        <div class="greeting">
          <div>
            <p class="eyebrow">STUDENT LIBRARY</p>
            <h1 id="page-title">Book Catalogue</h1>

            <p id="page-description">
              Check availability and request a book from your library.
            </p>
          </div>

          <time
            class="dashboard-clock"
            id="today"
            aria-label="Current Philippine date and time"
          >
            <span id="clock-date" class="clock-date"></span>
            <span id="clock-time" class="clock-time"></span>
          </time>
        </div>

        <div
          id="profile-notice"
          class="profile-notice"
          role="status"
          hidden
        ></div>

        <section class="panel" aria-labelledby="section-title">
          <div class="panel-heading">
            <h2 id="section-title">Browse books</h2>
            <span class="count" id="result-count"></span>
          </div>

          <div class="categories" id="categories" hidden></div>
          <div class="book-grid" id="book-grid"></div>
          <div id="details" hidden></div>

          <p class="catalog-note" id="catalog-note">
            Illustrated covers · Borrowing requires admin approval.
          </p>
        </section>

        <p
          class="status"
          id="status"
          role="status"
          aria-live="polite"
        ></p>
      </main>
    </div>
  </div>
</body>
</html>
