<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Library Login</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>

<body>
  <main class="login-container">
    <section class="login-panel" aria-labelledby="form-title">
      <p class="subtitle">LIBRARY MANAGEMENT SYSTEM</p>

      <h2 id="form-title">Welcome back</h2>

      <p class="description" id="form-description">
        Sign in to access your library account.
      </p>

      <form id="login-form">
        <div id="registration-fields" hidden>
          <div class="form-group">
            <label for="full-name">Full name</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              maxlength="100"
              disabled
            >
          </div>
        </div>

        <div class="form-group">
          <label for="username">Email address</label>
          <input
            type="email"
            id="username"
            name="email"
            placeholder="Enter your email address"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="toggle-password"
              aria-controls="password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <div class="form-group" id="confirm-field" hidden>
          <label for="confirm-password">Confirm password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            disabled
          >
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember">
            Remember me
          </label>

          <button
            type="button"
            class="text-button"
            id="forgot-password"
          >
            Forgot password?
          </button>
        </div>

        <button type="submit" class="login-button" id="submit-button">
          Sign in →
        </button>

        <div class="register">
          <span id="switch-description">Need an account?</span>

          <button
            type="button"
            class="text-button"
            id="switch-mode"
          >
            Register here
          </button>
        </div>

        <p
          id="message"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>

        <button
          type="button"
          class="text-button"
          id="resend-verification"
          hidden
        >
          Resend verification email
        </button>
      </form>
    </section>
  </main>
</body>
</html>
